services:
  minecraft:
    build:
      context: ./server
      args:
        MINECRAFT_VERSION: ${MINECRAFT_VERSION:-26.3}

    image: local/minecraft:${MINECRAFT_VERSION:-26.3}
    container_name: minecraft

    restart: unless-stopped
    stop_grace_period: 2m

    ports:
      - "${SERVER_PORT:-25565}:25565/tcp"

    environment:
      EULA: ${EULA:-FALSE}
      MIN_MEMORY: ${MEMORY_MIN:-1G}
      MAX_MEMORY: ${MEMORY_MAX:-2G}
      RCON_ENABLED: ${RCON_ENABLED:-false}
      RCON_PORT: ${RCON_PORT:-25575}
      RCON_PASSWORD: ${RCON_PASSWORD:-}

    volumes:
      - ./data:/data

    stdin_open: true
    tty: true

    security_opt:
      - no-new-privileges:true

    mem_limit: ${CONTAINER_MEMORY:-4G}
    cpus: ${CONTAINER_CPUS:-1.0}
