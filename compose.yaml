services:
  server:
    build:
      context: ./server
      args:
        MINECRAFT_VERSION: ${MINECRAFT_VERSION:-26.3}

    image: local/minecraft-server:${MINECRAFT_VERSION:-26.3}
    container_name: minecraft-server

    restart: unless-stopped
    stop_grace_period: 2m

    ports:
      - "${SERVER_PORT:-25565}:25565/tcp"

    environment:
      EULA: ${EULA:-FALSE}
      MIN_MEMORY: ${MEMORY_MIN:-1G}
      MAX_MEMORY: ${MEMORY_MAX:-2G}
      RCON_ENABLED: ${RCON_ENABLED:-false}
      RCON_PORT: ${RCON_PORT:-25575}
      RCON_PASSWORD: ${RCON_PASSWORD:-}

    volumes:
      - ./data:/data

    stdin_open: true
    tty: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 512

    mem_limit: ${CONTAINER_MEMORY:-4G}
    cpus: ${CONTAINER_CPUS:-1.0}

  backup:
    build:
      context: ./backup

    image: local/minecraft-backup:latest
    container_name: minecraft-backup

    env_file:
      - .env

    restart: unless-stopped
    depends_on:
      - server

    environment:
      BACKUP_CRON: ${BACKUP_CRON:-0 0 * * *}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      RCON_ENABLED: ${RCON_ENABLED:-false}
      RCON_HOST: minecraft-server
      RCON_PORT: ${RCON_PORT:-25575}
      RCON_PASSWORD: ${RCON_PASSWORD:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backup/restic}
      TZ: ${TZ:-UTC}

    volumes:
      - ./data:/data:ro
      - ./backups:/backup
      - ./restic-config:/restic-config:ro

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - SETGID
      - SETUID

    pids_limit: 512

    mem_limit: 256m
    cpus: 0.5
